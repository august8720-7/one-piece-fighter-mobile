<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手机版开发预览</title>
<style>html,body{margin:0;background:#07131f;color:#f3dec0;font:14px "Microsoft YaHei",sans-serif}header{padding:10px}main{display:grid;gap:12px;justify-items:center}section{position:relative;overflow:hidden;background:#091d2c;border:1px solid #9a7b3c;box-sizing:content-box}iframe{border:0;position:absolute;left:0;top:0;transform-origin:top left}a{color:#f4d075;margin-right:12px}small{display:block;margin:5px 0}</style></head>
<body><header>完整游戏开发预览<small>同一电脑的独立网页上下文；不是实体手机验收。缩放只用于容纳预览，不改变游戏内容。</small>
<a href="?w=844&h=390">844×390</a><a href="?w=667&h=375">667×375</a><a href="?w=390&h=844">竖屏</a><a href="?pair=1&w=844&h=390">双端联机</a></header><main></main>
<script type="module">
const q=new URLSearchParams(location.search),w=Math.max(320,Math.min(1280,Number(q.get('w'))||844)),h=Math.max(320,Math.min(1024,Number(q.get('h'))||390));
const pairs=q.get('pair')==='1'?2:1,frames=[];
for(let n=0;n<pairs;n++){const box=document.createElement('section'),frame=document.createElement('iframe');frame.title=`玩家${n+1}`;frame.src='./?art=anime&scope=full&quality=high';frame.width=w;frame.height=h;box.append(frame);document.querySelector('main').append(box);frames.push({box,frame});}
function fit(){const s=Math.min(1,(innerWidth-24)/w);for(const{box,frame}of frames){box.style.width=`${w*s}px`;box.style.height=`${h*s}px`;frame.style.width=`${w}px`;frame.style.height=`${h}px`;frame.style.transform=`scale(${s})`;}}
addEventListener('resize',fit);fit();
</script></body></html>
